<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聪明钱跟单 · 模拟盘</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow-anchor:none}
body{background:#000;color:#f2f2f2;font:14px/1.4 -apple-system,system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif}
.w{max-width:470px;margin:0 auto;padding:14px 12px 30px}
.hd{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;gap:10px;align-items:center}.av{width:44px;height:44px;border-radius:12px;background:#1a1a1a;border:1px solid #333;display:grid;place-items:center;font-size:22px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px}.sub{font-size:11px;color:#999;background:#141414;border:1px solid #2a2a2a;padding:1px 7px;border-radius:5px;display:inline-block;margin-top:2px}
.live{display:flex;gap:6px;align-items:center;background:#111;border:1px solid #333;padding:6px 13px;border-radius:20px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:p 1.6s infinite}.off .dot{background:#f87171;animation:none}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.tk{overflow:hidden;margin:12px -12px 8px;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tki{display:inline-block;animation:sc 40s linear infinite}.tki span{margin-right:18px;font-weight:700}
@keyframes sc{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.chip{display:inline-block;padding:1px 6px;border-radius:5px;font-size:12px;font-weight:700;background:#161616;border:1px solid #2a2a2a}
.g{color:#4ade80}.r{color:#f87171}
.hero{position:relative;padding:8px 2px 0}.eqh{opacity:.85;font-size:14px}
.big{font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1.05}.big small{font-size:28px;opacity:.6;letter-spacing:0}
.mult{position:absolute;right:4px;top:6px;background:#fff;color:#000;font-weight:800;font-size:22px;padding:4px 14px;border-radius:14px}
.flt{height:100px;overflow:hidden;position:absolute;right:70px;top:48px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}.flt .chip{background:#111;padding:4px 9px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.pnl{background:#141414;border:1px solid #2a2a2a;padding:3px 9px;border-radius:5px;font-weight:700;font-size:15px}
svg.ch{width:100%;height:150px;display:block;margin-top:6px}.tl{display:flex;justify-content:space-between;font-size:11px;opacity:.75}
.card{background:#0e0e0e;border-radius:16px;padding:12px 12px;margin-top:12px;border:1px solid #262626}
.ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.ct h2{margin:0;font-size:20px;font-weight:800}.ct .m{font-size:12px;opacity:.7}
.fr{height:46px;overflow:hidden;display:grid;grid-template-columns:34px 82px 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-radius:9px}
.fr.hl{background:#1a1a1a;outline:1px solid #3a3a3a}
.ic{border:1px solid #3a3a3a;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}.ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2}
.fn b{display:block;font-size:15px}.fn i{font-style:normal;font-size:11px;opacity:.6}
.fd{font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.9}
.pl{font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap}
.lg{height:176px;overflow:hidden;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}.lg div{height:22px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.lg .d{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}.lg .t{opacity:.6;margin-right:6px}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px}.sk .n{float:right;font-weight:700}
.bar{height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:3px}.bar i{display:block;height:100%;background:#e5e5e5;border-radius:2px;transition:width .6s}
.tabs{display:flex;gap:6px;margin:10px 0 0;background:#111;border:1px solid #2a2a2a;border-radius:12px;padding:4px}.tabs button{flex:1;background:none;border:0;color:#aaa;font:700 15px inherit;padding:8px;border-radius:9px;cursor:pointer}.tabs button.on{background:#fff;color:#000}
.mut{opacity:.55}.ft{text-align:center;font-size:11px;opacity:.6;margin-top:14px}
</style></head><body><div class="w">
<div class="hd"><div class="logo"><div class="av">🤖</div><div><h1>聪明钱跟单 · 模拟盘</h1><span class="sub">模拟，不动真钱</span></div></div><div id="live" class="live off"><span class="dot"></span><span id="lt">连接中</span></div></div>
<div class="tabs" id="tabs"><button data-c="bsc" class="on">BSC</button><button data-c="sol">SOL</button></div>
<div class="tk"><div class="tki" id="tk"></div></div>
<div class="hero"><div class="eqh" id="eqh">Equity · 起始 $90</div><div class="big" id="big">$—</div>
<div class="mult" id="mult">—×</div><div class="flt" id="flt"></div>
<div class="row"><span class="pnl" id="pnl">—</span><span id="wr" style="opacity:.85"></span></div>
<svg class="ch" id="ch" viewBox="0 0 450 150" preserveAspectRatio="none"></svg><div class="tl"><span id="t0"></span><span id="t1"></span></div></div>
<div class="card"><div class="ct"><h2>Copy funnel</h2><span class="m" id="fm"></span></div><div id="fun"></div></div>
<div class="card"><div class="ct"><h2>Copy log</h2><span class="m" id="lm" ></span></div><div class="lg" id="log"></div></div>
<div class="card"><div class="ct"><h2>Why signals got skipped</h2><span class="m" id="bw"></span></div><div class="sk" id="sk"></div></div>
<div class="ft" id="ft">约每分钟更新 · 时间为马来西亚时间（UTC+8）</div></div>
<script>
const RZ={'liquidity<20k':'流动性不足2万美元','too_old':'项目太老','top10_unknown':'读不到前十持仓','bulk_snipe_1m':'开盘首分钟批量扫单','up>90%_in_40m':'40分钟内涨超90%','top10>42%':'前十持仓超42%','dev>9%':'开发者持仓超9%','no_smart_money':'没有聪明钱买入','honeypot':'貔貅盘','mint_authority_active':'增发权限未放弃','freeze_authority_active':'冻结权限未放弃','authority_unknown':'读不到代币权限'};
const SK=['liquidity<20k','too_old','top10_unknown','bulk_snipe_1m','up>90%_in_40m','top10>42%','dev>9%','no_smart_money'];
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rz=r=>{if(RZ[r])return RZ[r];if(/^score</.test(r))return '评分不足 '+r.slice(5);return r};
const hms=x=>{const d=new Date(x);return isNaN(d)?'--:--:--':d.toLocaleTimeString('en-GB',{timeZone:'Asia/Kuala_Lumpur',hour12:false})};
const hm=x=>hms(x).slice(0,5);
const K=v=>v==null||isNaN(v)?'—':v>=1e6?'$'+(v/1e6).toFixed(2)+'M':v>=1e3?'$'+(v/1e3).toFixed(1)+'K':'$'+Math.round(v);
const usd=v=>(v<0?'-':'+')+'$'+Math.abs(v).toFixed(2);
const tok=n=>e(String(n||'?').split(' / ')[0]);
const IC={s:'<circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/>',f:'<path d="M3 4h18l-7 8v6l-4 2v-8z"/>',a:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',n:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>',g:'<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/>'};
const ic=(k,c)=>`<div class="ic" style="background:#1c1c1c"><svg viewBox="0 0 24 24">${IC[k]}</svg></div>`;
let cur=null;let CH=location.hash==='#sol'?'sol':'bsc';
function anim(to){const el=document.getElementById('big');const from=cur??to;cur=to;const t0=performance.now();
 const f=n=>{const p=Math.min(1,(n-t0)/700),v=from+(to-from)*(1-Math.pow(1-p,3));const [a,b]=v.toFixed(2).split('.');el.innerHTML=`$${Number(a).toLocaleString('en')}<small>.${b}</small>`;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function chart(pts){const svg={set innerHTML(h){H('ch',h)}};if(!pts.length){svg.innerHTML='<text x="10" y="80" fill="#fff" opacity=".6" font-size="13">暂无资金数据</text>';return}
 let lo=Math.min(...pts),hi=Math.max(...pts);if(hi-lo<0.5){lo-=0.5;hi+=0.5}
 const X=i=>pts.length<2?225:i/(pts.length-1)*440+4,Y=v=>140-(v-lo)/(hi-lo)*120;
 const P=pts.map((v,i)=>[X(i),Y(v)]);let d=`M${P[0][0]},${P[0][1]}`;
 for(let i=1;i<P.length;i++){const [x0,y0]=P[i-1],[x1,y1]=P[i],cx=(x0+x1)/2;d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`}
 const L=P[P.length-1];
 svg.innerHTML=`<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
 <path d="${d} L${L[0]},150 L${P[0][0]},150Z" fill="url(#ag)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
 <circle cx="${L[0]}" cy="${L[1]}" r="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="${L[0]}" cy="${L[1]}" r="2" fill="#fff"/>`}
async function tick(){let s;try{s=await (await fetch((CH==='sol'?'data-sol.json':'data.json')+'?t='+Date.now(),{cache:'no-store'})).json()}catch{setLive(false,'离线');return}
 const hts=s.heartbeat?.ts?Date.parse(s.heartbeat.ts):s.heartbeat_mtime,age=hts?(s.now-hts)/1000:1e9;const da=(Date.now()-s.now)/1000;const ok=age<180&&da<180;setLive(ok,ok?'Live':(da>=180?'数据延迟':'离线'));
 // ticker
 const seen=new Set(),tk=[];for(const g of s.signals||[]){if(seen.has(g.pool))continue;seen.add(g.pool);tk.push(g);if(tk.length>14)break}
 const tkh=tk.map(g=>`<span>${tok(g.name)} ${K(g.liq_usd)} ${g.run40_pct==null?'<span class="chip mut">—</span>':`<span class="chip ${g.run40_pct>=0?'g':'r'}">${g.run40_pct>=0?'+':''}${g.run40_pct}%</span>`}</span>`).join('');
 const tkel=document.getElementById('tk');if(tkel.dataset.h!==tkh){tkel.dataset.h=tkh;tkel.innerHTML=tkh+tkh||'<span class="mut">暂无信号</span>'}
 // hero
 const run=s.first_ts?Math.max(0,Math.round((s.now-Date.parse(s.first_ts))/60000)):null;
 document.getElementById('eqh').textContent=`Equity · 起始 $${s.start}`+(run!=null?` · 运行 ${run>=60?Math.floor(run/60)+'h'+run%60+'m':run+'m'}`:'');
 anim(Number(s.equity)||0);const pnl=s.equity-s.start;
 document.getElementById('mult').textContent=(s.equity/s.start).toFixed(2)+'×';
 const pe=document.getElementById('pnl');pe.className='pnl '+(pnl>0?'g':pnl<0?'r':'');pe.textContent=`${usd(pnl)} (${(pnl/s.start*100).toFixed(1)}%)`;
 H('flt',(s.recent_results||[]).map(t=>`<span class="chip ${t.pnl>=0?'g':'r'}">${usd(+t.pnl||0)}</span>`).join(''));
 document.getElementById('wr').textContent=`${s.opened} 笔跟单 · 胜率 ${s.closed?Math.round(s.wins/s.closed*100)+'%':'—'}`;
 const ser=(s.equity_series||[]).filter(x=>!isNaN(x[1]));chart(ser.map(x=>x[1]));
 document.getElementById('t0').textContent=ser.length?hm(ser[0][0])+' MYT':'';document.getElementById('t1').textContent=ser.length?hm(ser[ser.length-1][0])+' MYT':'';
 // funnel
 const ls=s.last_signal,lr=s.last_rejected,lw=s.last_watch,tr=s.trades||[];
 const lastBuy=tr.find(t=>/OPEN|RESULT|CLOSE|PARTIAL/i.test(t.action||''));
 const sn=lastBuy?(lastBuy.action==='RESULT'?`last <b class="${lastBuy.pnl>=0?'g':'r'}">${usd(+lastBuy.pnl)}</b> · ${tok(lastBuy.name)}`:`${lastBuy.action==='OPEN'?'bought':'sold'} ${tok(lastBuy.name)}`):'暂无';
 const rows=[['s','#3b82f6','Scout','追踪钱包',ls?`${tok(ls.name)} <span class="mut">${K(ls.liq_usd)} · ${s.smart_wallets} 钱包</span>`:'<span class="mut">暂无</span>',`${s.total} signals`,'#1f1f1f'],
  ['f','#f59e0b','Filter','硬性规则',lr?`<s>${tok(lr.name)}</s> <span class="mut">× ${e(rz((lr.reasons||[])[0]))}</span>`:'<span class="mut">暂无</span>',`${s.rejected} killed`,'#1f1f1f'],
  ['a','#8b5cf6','Analyst','深度研判',lw?`${tok(lw.name)} <span class="mut">评分 ${lw.score??'—'}</span>`:'<span class="mut">暂无</span>',`${s.watch} watch`,'#1f1f1f'],
  ['n','#22c55e','Sniper','跟单',sn,`${s.opened} copied`,'#1f1f1f'],
  ['g','#ec4899','Guard','止损规则','<span class="mut">按规则止损</span>',`${s.stops} stops`,'#1f1f1f']];
 H('fun',rows.map(([k,c,n,sub,d,p,pc],i)=>`<div class="fr${i==2&&lw?' hl':''}">${ic(k,c)}<div class="fn"><b>${n}</b><i>${sub}</i></div><div class="fd">${d}</div><span class="pl" style="background:${pc};border:1px solid #333">${p}</span></div>`).join(''));
 document.getElementById('fm').textContent=`${s.total} signals · ${s.opened} copied`;
 // log
 const ev=[];for(const g of (s.signals||[]).slice(0,12)){
  if(g.decision==='rejected')ev.push([g.ts,'#777','#fff','Filter killed 过滤',g.name,(g.reasons||[]).map(rz).join('、')]);
  else if(g.decision==='watch')ev.push([g.ts,'#777','#fff','Analyst passed 观察',g.name,'评分 '+(g.score??'—')]);
  else ev.push([g.ts,'#777','#fff','Scout spotted 发现',g.name,g.decision||'']);}
 for(const t of tr.slice(0,12)){const a=t.action||'';
  if(a==='OPEN')ev.push([t.ts,'#777','#fff','Sniper bought 买入',t.name,'']);
  else if((a==='CLOSE'||a==='PARTIAL')&&/STOP/.test(t.why||''))ev.push([t.ts,'#777','#fff','Guard stopped 止损',t.name,t.why]);
  else if(a==='CLOSE'||a==='PARTIAL')ev.push([t.ts,'#777','#fff','Sniper sold 卖出',t.name,t.why||'']);
  else if(a==='RESULT')ev.push([t.ts,'#777','#fff','Sniper sold 结算',t.name,usd(+t.pnl||0)]);}
 ev.sort((a,b)=>Date.parse(b[0])-Date.parse(a[0]));
 H('log',ev.slice(0,8).map(([t,dc,vc,v,n,r],i)=>`<div style="opacity:${1-i*.07}"><span class="d" style="background:${dc}"></span><span class="t">${hms(t)}</span><b style="color:${vc}">${v}</b> ${tok(n)} <span class="mut">· ${e(r)}</span></div>`).join('')||'<div class="mut">暂无</div>');
 document.getElementById('lm').textContent=`${s.rejected} skipped`;
 // skipped
 const R=s.reasons||{},keys=[...SK,...Object.keys(R).filter(k=>!SK.includes(k))],mx=Math.max(1,...Object.values(R));
 H('sk',keys.map(k=>`<div><span>${e(rz(k))}</span><span class="n">${R[k]||0}</span><div class="bar"><i style="width:${(R[k]||0)/mx*100}%"></i></div></div>`).join(''));
 document.getElementById('bw').textContent=s.best==null?'best — · worst —':`best ${usd(s.best)} · worst ${usd(s.worst)}`;
 document.getElementById('ft').textContent=`更新于 ${hms(s.now)} MYT · 每 5 秒检查 · 数据约每分钟推送`;}
function H(id,h){const el=document.getElementById(id);if(el.dataset.h!==h){el.dataset.h=h;el.innerHTML=h}}
function setLive(ok,t){document.getElementById('live').className='live'+(ok?'':' off');document.getElementById('lt').textContent=t}
function setTab(c){CH=c;cur=null;history.replaceState(null,'',c==='sol'?'#sol':'#bsc');document.querySelectorAll('#tabs button').forEach(b=>b.className=b.dataset.c===c?'on':'');tick()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.c));setTab(CH);setInterval(tick,5000);
</script></body></html>
